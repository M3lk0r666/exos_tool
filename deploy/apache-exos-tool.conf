<VirtualHost *:80>
    ServerName exos.tudominio.com
    DocumentRoot /var/www/exos_tool/public

    <Directory /var/www/exos_tool/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Cabeceras básicas de seguridad
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/exos_tool_error.log
    CustomLog ${APACHE_LOG_DIR}/exos_tool_access.log combined
</VirtualHost>
